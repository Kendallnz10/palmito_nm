flutter_native_splash:
  color: "#F2E8D5"
  image: assets/img/LOGOV2.png
  
  # Esto evita que la imagen se estire para llenar la pantalla
  android_gravity: center
  ios_content_mode: center

  # Para Android 12 en adelante (donde suele dar más problemas de tamaño)
  android_12:
    image: assets/img/LOGOV2.png
    color: "#F2E8D5"
    
  fullscreen: true