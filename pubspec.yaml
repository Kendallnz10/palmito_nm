name: palmito_nm
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  intl: ^0.20.2
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.6
  flutter_paypal_payment: ^1.0.8
  xml: ^6.3.0
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  image: ^4.8.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/logoapp2.png"
  adaptive_icon_background: "#F2E8D5"
  adaptive_icon_foreground: "assets/img/logoapp2.png"

flutter_native_splash:
  color: "#F2E8D5"
  image: assets/img/LOGOV2_splash.png   # ← cambia esto

  android_gravity: center
  ios_content_mode: center

  android_12:
    color: "#F2E8D5"
    icon_background_color: "#F2E8D5"

  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/img/logoapp2.png
    - assets/img/
    - assets/img/visa.png
    - assets/img/mastercard.png
    - assets/img/google_logo.png
    - assets/img/facebook_logo.png